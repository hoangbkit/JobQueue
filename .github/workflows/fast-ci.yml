name: Fast CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: job-queue-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain info
        run: |
          uname -m
          sw_vers
          swift --version

      - name: Run package tests
        run: swift test --parallel
